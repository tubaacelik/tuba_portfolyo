<svg viewBox="0 0 560 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secure AI Chat data flow: Turkish PII detection, tokenization, encrypted Vault and user approval layers">
  <rect width="560" height="350" fill="#f8f5f0"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="560" height="48" fill="#1a1512"/>
  <text x="20" y="30" font-family="'Work Sans', sans-serif" font-size="13" font-weight="800" fill="#f8f5f0" letter-spacing="2">SECURE AI CHAT · DATA FLOW</text>
  <rect x="480" y="10" width="60" height="26" fill="#e85d7a" stroke="#f8f5f0" stroke-width="1.5"/>
  <text x="510" y="27" font-family="'Work Sans', sans-serif" font-size="10" font-weight="800" fill="#f8f5f0" text-anchor="middle">MVP</text>

  <!-- Step 1: User Chat -->
  <rect x="16" y="68" width="140" height="168" fill="#fff" stroke="#1a1512" stroke-width="3"/>
  <rect x="21" y="71" width="140" height="168" fill="none" stroke="#1a1512" stroke-width="1" opacity="0.3"/>
  <rect x="21" y="240" width="140" height="4" fill="#1a1512" opacity="0.15"/>

  <text x="86" y="94" font-family="'Work Sans', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1" fill="#e85d7a">USER MESSAGE</text>

  <!-- Chat bubble -->
  <rect x="28" y="102" width="120" height="44" rx="6" fill="#fce4eb" stroke="#1a1512" stroke-width="2"/>
  <text x="38" y="120" font-family="'Work Sans', sans-serif" font-size="10" fill="#1a1512">Hi, please look up</text>
  <text x="38" y="134" font-family="'Work Sans', sans-serif" font-size="10" fill="#1a1512">ID 12345...</text>
  <polygon points="48,146 58,146 48,155" fill="#fce4eb" stroke="#1a1512" stroke-width="2"/>

  <!-- Sensitive data labels -->
  <rect x="28" y="156" width="76" height="18" fill="#e85d7a" stroke="#1a1512" stroke-width="1.5"/>
  <text x="66" y="168" font-family="'Work Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#fff">NAT.ID · IBAN</text>
  <rect x="28" y="180" width="60" height="18" fill="#e85d7a" stroke="#1a1512" stroke-width="1.5" opacity="0.6"/>
  <text x="58" y="192" font-family="'Work Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#fff">PHONE</text>
  <rect x="28" y="204" width="50" height="18" fill="#e85d7a" stroke="#1a1512" stroke-width="1.5" opacity="0.4"/>
  <text x="53" y="216" font-family="'Work Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#fff">EMAIL</text>

  <!-- Arrow 1 -->
  <line x1="156" y1="152" x2="192" y2="152" stroke="#1a1512" stroke-width="2.5"/>
  <polygon points="188,147 198,152 188,157" fill="#1a1512"/>
  <text x="172" y="145" font-family="'Work Sans', sans-serif" font-size="9" fill="#5a5550" text-anchor="middle">detect</text>

  <!-- Step 2: PII Detection -->
  <rect x="200" y="68" width="140" height="168" fill="#e6f7f5" stroke="#1a1512" stroke-width="3"/>
  <rect x="204" y="236" width="140" height="4" fill="#1a1512" opacity="0.15"/>

  <text x="270" y="88" font-family="'Work Sans', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1" fill="#1ba697">PII DETECTION</text>
  <text x="270" y="100" font-family="'Work Sans', sans-serif" font-size="8" text-anchor="middle" fill="#5a5550">tr_core_news_trf + rules</text>

  <!-- Shield -->
  <path d="M270,112 L296,122 L296,148 Q296,164 270,174 Q244,164 244,148 L244,122 Z" fill="#1ba697" stroke="#1a1512" stroke-width="2.5"/>
  <text x="270" y="148" font-family="'Work Sans', sans-serif" font-size="18" text-anchor="middle" font-weight="900" fill="#fff">🔒</text>

  <!-- Two modes -->
  <rect x="208" y="180" width="56" height="36" fill="#fff" stroke="#1a1512" stroke-width="2"/>
  <text x="236" y="193" font-family="'Work Sans', sans-serif" font-size="8" font-weight="900" text-anchor="middle" fill="#1a1512">PLACE</text>
  <text x="236" y="205" font-family="'Work Sans', sans-serif" font-size="8" font-weight="900" text-anchor="middle" fill="#1a1512">HOLDER</text>
  <rect x="274" y="180" width="56" height="36" fill="#fff" stroke="#1a1512" stroke-width="2"/>
  <text x="302" y="193" font-family="'Work Sans', sans-serif" font-size="8" font-weight="900" text-anchor="middle" fill="#1a1512">TOKEN</text>
  <text x="302" y="205" font-family="'Work Sans', sans-serif" font-size="8" font-weight="900" text-anchor="middle" fill="#1a1512">IZE</text>

  <!-- Arrow 2 -->
  <line x1="340" y1="152" x2="378" y2="152" stroke="#1a1512" stroke-width="2.5"/>
  <polygon points="374,147 384,152 374,157" fill="#1a1512"/>
  <text x="360" y="145" font-family="'Work Sans', sans-serif" font-size="9" fill="#5a5550" text-anchor="middle">vault</text>

  <!-- Step 3: Token Vault -->
  <rect x="386" y="68" width="156" height="168" fill="#1a1512" stroke="#1a1512" stroke-width="3"/>
  <rect x="390" y="236" width="156" height="4" fill="#1a1512" opacity="0.4"/>

  <text x="464" y="90" font-family="'Work Sans', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1" fill="#f8e05a">TOKEN VAULT</text>
  <text x="464" y="102" font-family="'Work Sans', sans-serif" font-size="8" text-anchor="middle" fill="#9a9488">PostgreSQL · Encrypted</text>

  <!-- Vault records -->
  <rect x="396" y="112" width="134" height="22" fill="#2a2520" stroke="#555" stroke-width="1"/>
  <text x="406" y="127" font-family="'Work Sans', monospace" font-size="9" fill="#f8e05a">tok_a1b2 → ████████</text>
  <rect x="396" y="138" width="134" height="22" fill="#2a2520" stroke="#555" stroke-width="1"/>
  <text x="406" y="153" font-family="'Work Sans', monospace" font-size="9" fill="#f8e05a">tok_c3d4 → ████████</text>
  <rect x="396" y="164" width="134" height="22" fill="#2a2520" stroke="#555" stroke-width="1"/>
  <text x="406" y="179" font-family="'Work Sans', monospace" font-size="9" fill="#4a9e97">tok_e5f6 → [ciphertext]</text>
  <rect x="396" y="190" width="134" height="22" fill="#2a2520" stroke="#555" stroke-width="1"/>
  <text x="406" y="205" font-family="'Work Sans', monospace" font-size="9" fill="#4a9e97">tok_g7h8 → [nonce+data]</text>

  <!-- Lock icon -->
  <rect x="524" y="68" width="18" height="18" fill="#f8e05a" stroke="#f8f5f0" stroke-width="1"/>
  <text x="533" y="81" font-family="'Work Sans', sans-serif" font-size="12" text-anchor="middle">🔐</text>

  <!-- Approval card (bottom) -->
  <rect x="16" y="252" width="326" height="78" fill="#fffbe6" stroke="#c9a200" stroke-width="2.5"/>
  <rect x="20" y="328" width="326" height="4" fill="#c9a200" opacity="0.3"/>

  <text x="30" y="268" font-family="'Work Sans', sans-serif" font-size="9" font-weight="900" letter-spacing="1" fill="#c9a200">APPROVAL · HUMAN-IN-THE-LOOP</text>
  <rect x="30" y="276" width="190" height="44" fill="#fff" stroke="#1a1512" stroke-width="2"/>
  <text x="40" y="293" font-family="'Work Sans', sans-serif" font-size="10" fill="#1a1512" font-weight="600">Cancel order #ORD-2891?</text>
  <text x="40" y="308" font-family="'Work Sans', sans-serif" font-size="9" fill="#5a5550">Name: [PLACEHOLDER] · Total: 249.90</text>

  <rect x="236" y="278" width="62" height="26" fill="#e85d7a" stroke="#1a1512" stroke-width="2"/>
  <text x="267" y="295" font-family="'Work Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#fff">APPROVE</text>
  <rect x="306" y="278" width="44" height="26" fill="#f8f5f0" stroke="#1a1512" stroke-width="2"/>
  <text x="328" y="295" font-family="'Work Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#1a1512">CANCEL</text>

  <!-- Same-origin box -->
  <rect x="356" y="252" width="186" height="78" fill="#f0ebe3" stroke="#1a1512" stroke-width="2.5"/>
  <text x="449" y="272" font-family="'Work Sans', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1" fill="#1a1512">SAME-ORIGIN PROXY</text>
  <text x="449" y="288" font-family="'Work Sans', sans-serif" font-size="9" text-anchor="middle" fill="#5a5550">Browser → Next.js frontend</text>
  <text x="449" y="302" font-family="'Work Sans', sans-serif" font-size="9" text-anchor="middle" fill="#5a5550">Backend ports not exposed</text>
  <text x="449" y="314" font-family="'Work Sans', sans-serif" font-size="9" text-anchor="middle" fill="#5a5550">directly to the browser</text>
  <circle cx="362" cy="265" r="5" fill="#4ade80" stroke="#1a1512" stroke-width="1.5"/>
  <text x="375" y="269" font-family="'Work Sans', sans-serif" font-size="8" fill="#1a1512">isolated</text>
</svg>
